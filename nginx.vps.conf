# Configuración de Nginx para el VPS (reverse proxy de Next.js y NestJS).
#
# Este archivo se copia a /etc/nginx/sites-available/salon-tatto durante el
# deploy (.github/workflows/deploy.yml), sólo si el usuario tiene permiso
# NOPASSWD para `install`, `nginx -t` y `systemctl reload nginx`.
#
# Si Cloudflare está en modo SSL "Flexible", los bloques del puerto 80 no
# redirigen cuando la petición viene de Cloudflare (header CF-Connecting-IP).
# Sin esa condición, nginx devolvería un 301 a HTTPS y Cloudflare lo propagaría
# al visitante creando un bucle ERR_TOO_MANY_REDIRECTS.
# Con Cloudflare en "Full (strict)" el tráfico entra por el 443 y nada de esto
# afecta.

# Configuración del Frontend (Next.js)
server {
    server_name larolatattoonyc.com www.larolatattoonyc.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/larolatattoonyc.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/larolatattoonyc.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Configuración del Backend (NestJS API)
server {
    server_name api.larolatattoonyc.com;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/larolatattoonyc.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/larolatattoonyc.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP: si la petición viene de Cloudflare se sirve la app; si es un acceso
# directo al origen, se redirige a HTTPS.
server {
    listen 80;
    server_name larolatattoonyc.com www.larolatattoonyc.com;

    if ($http_cf_connecting_ip = "") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name api.larolatattoonyc.com;

    if ($http_cf_connecting_ip = "") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
